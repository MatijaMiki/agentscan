[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscan"
version = "0.1.0"
description = "Flight recorder and authority scanner for AI agents. Reads locally, transmits nothing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matija Mikulinec" }]
keywords = ["ai", "agents", "security", "audit", "observability", "least-privilege"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
# Deliberately empty. This is pointed at your own credentials; a dependency
# tree is something a reviewer has to audit before that is reasonable.
dependencies = []

[project.urls]
Homepage = "https://github.com/MatijaMiki/agentscan"
Source = "https://github.com/MatijaMiki/agentscan"
Issues = "https://github.com/MatijaMiki/agentscan/issues"

[project.scripts]
agentscan = "agentscan.cli:main"

[tool.setuptools]
packages = ["agentscan"]
include-package-data = false

[tool.setuptools.package-data]
agentscan = ["demo/*.json"]
